<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Szyfr Leonarda Królczyka</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Consolas, "Courier New", monospace;
    max-width: 1000px;
    margin: 0 auto;
    padding: 30px;
    line-height: 1.8;
    background: #0d1117;
    color: #c9d1d9;
}

h1 {
    color: #39ff14;
    font-size: 2.8rem;
    text-shadow: 0 0 10px rgba(57,255,20,0.4);
    margin-bottom: 20px;
}

h2 {
    color: #58a6ff;
    margin-top: 25px;
    margin-bottom: 15px;
}

h3, h4, h5 {
    margin-bottom: 10px;
}

p, li {
    color: #c9d1d9;
}

hr {
    border: none;
    height: 1px;
    background: linear-gradient(to right, transparent, #39ff14, transparent);
    margin: 25px 0;
}

a {
    color: #58a6ff;
    text-decoration: none;
    transition: 0.2s;
}

a:hover {
    color: #79c0ff;
    text-shadow: 0 0 5px #58a6ff;
}

ol, ul {
    margin-left: 30px;
    margin-top: 15px;
}

li {
    margin-bottom: 10px;
}

mark {
    background: #39ff14;
    color: black;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: bold;
}

body > *:not(hr):not(.top-btn) {
    background: #161b22;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
    border: 1px solid #30363d;
}

.top-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 1000;

    background: #39ff14;
    color: #000 !important;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;

    font-weight: bold;
    text-decoration: none;
    cursor: pointer;

    transition: all 0.2s ease;
    box-shadow: 0 0 10px rgba(57,255,20,0.3);
}

.top-btn:hover {
    color: #000 !important;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(57,255,20,0.7);
}

img {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    border: 1px solid #30363d;
}

body::before {
    content: "SZYFR LEONARDA KRÓLCZYKA";
    display: block;
    text-align: center;
    color: #39ff14;
    font-size: 0.9rem;
    letter-spacing: 4px;
    margin-bottom: 20px;
    opacity: 0.7;
}

@media (max-width: 768px) {
    body {
        padding: 15px;
    }

    h1 {
        font-size: 2rem;
    }

    .top-btn {
        top: 10px;
        right: 10px;
        padding: 10px 14px;
    }
}
</style>
</head>
<body>
    <a href='{{ url_for("index") }}'>&lAarr; Powrót do menu</a>
    <h1>Wyzwanie Poziom {{ poziom }}</h1>
    <h3>Będziesz musiał stawić czoła 5 testom, a każdy z nich dotyczy innego poziomu kodowania.</h3>
    <hr>
    <p>Jaka wiadomość została zakodowana w poniższym komunikacie?:</p>
    <h3>{{ wiadomosc }}</h3>
    <form method="post" action="/test">
        <p>Wpisz wiadomość: <input type="text" name="wiadomosc" size="100" required></p>
        <button type="submit">
            Wyślij
        </button>
    </form>
    <hr>
    <h4>Liczba twoich błędów wynosi: {{ bledy }}</h4>
</body>
</html>
